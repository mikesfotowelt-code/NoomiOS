name: Build NoomiOS

on:
  workflow_dispatch:
  push:
    paths:
      - 'recipes/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  bluebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Build NoomiOS Image
        uses: blue-build/github-action@v1.13
        with:
          recipe: recipe.yml
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          maximize_build_space: true
