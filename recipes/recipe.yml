# NoomiOS preview recipe — basiert auf Bazzite KDE Desktop für AMD
# Bei einem echten Build zuerst Base-Image und Tag gegen die aktuelle Bazzite-Registry prüfen.
version: 1
name: noomios
description: Bazzite KDE mit NoomiOS Desktop- und Streamingsoftware
base-image: ghcr.io/ublue-os/bazzite
image-version: stable
modules:
  - type: default-flatpaks
    configurations:
      - scope: system
        notify: true
        install:
          - com.obsproject.Studio
          - org.onlyoffice.desktopeditors
          - com.usebottles.bottles
          - org.gimp.GIMP
          - org.kde.digikam
          - org.darktable.Darktable
          - org.videolan.VLC
          - com.discordapp.Discord
          - com.heroicgameslauncher.hgl
          - com.github.tchx84.Flatseal
          - org.mozilla.firefox
